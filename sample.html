<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saree Dispatch Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .register-title {
            background: #70ad47;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        .table-container {
            background: white;
            padding: 10px;
            overflow-x: auto;
        }

        table {
            min-width: 1800px;
        }

        th {
            background: #d9ead3;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }

        td {
            padding: 2px !important;
        }

        input,
        select {
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            font-size: 13px !important;
        }

        input:focus,
        select:focus {
            background: #fffde7;
        }

        .table-bordered td,
        .table-bordered th {
            border: 1px solid #cfcfcf;
        }

        .action-btn {
            min-width: 70px;
        }
    </style>
</head>

<body>

    <div class="container-fluid mt-3">

        <div class="register-title">
            SAREE DISPATCH REGISTER
        </div>

        <div class="table-container">

            <table class="table table-bordered table-sm">

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Quality</th>
                        <th>Fold</th>
                        <th>Agent</th>
                        <th>To Party</th>
                        <th>From</th>
                        <th>Transport</th>
                        <th>Station</th>
                        <th>Bale</th>
                        <th>Remark</th>
                        <th>Qty</th>
                        <th>Bale no.</th>
                    </tr>
                </thead>

                <tbody id="dispatchBody">

                    <tr>
                        <td><input type="date" class="form-control form-control-sm"></td>

                        <td>
                            <select class="form-select form-select-sm">
                                <option>RANG BARSE</option>
                                <option>GOLDEN RANI</option>
                                <option>GREEN APPLE</option>
                            </select>
                        </td>

                        <td>
                            <select class="form-select form-select-sm">
                                <option>HF</option>
                                <option>FF</option>
                            </select>
                        </td>

                        <td>
                            <select class="form-select form-select-sm">
                                <option>LUCKY AGENCY</option>
                                <option>KEDIYA TEXTILE</option>
                            </select>
                        </td>

                        <td>
                            <input type="text" class="form-control form-control-sm">
                        </td>

                        <td>
                            <input type="text" class="form-control form-control-sm" value="SPI">
                        </td>

                        <td>
                            <select class="form-select form-select-sm">
                                <option>RK EXPRESS</option>
                                <option>MEHTA</option>
                                <option>SURAJ</option>
                            </select>
                        </td>

                        <td>
                            <input type="text" class="form-control form-control-sm">
                        </td>

                        <td>
                            <input type="number" class="form-control form-control-sm">
                        </td>


                        <td>
                            <input type="text" class="form-control form-control-sm">
                        </td>

                        <td>
                            <input type="number" class="form-control form-control-sm">
                        </td><td>
                            <input type="text" class="form-control form-control-sm">
                        </td>

                        <td class="text-center">
                            <button class="btn btn-success btn-sm action-btn">
                                Save
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="mt-3">

            <button class="btn btn-primary" onclick="addRow()">
                + Add New Row
            </button>

            <button class="btn btn-success">
                Save All
            </button>

            <button class="btn btn-secondary">
                Export Excel
            </button>

        </div>

    </div>

    <script>

        function addRow() {

            const tbody = document.getElementById("dispatchBody");

            const row = tbody.rows[0].cloneNode(true);

            row.querySelectorAll("input").forEach(x => x.value = "");

            tbody.appendChild(row);
        }

    </script>

</body>

</html>
